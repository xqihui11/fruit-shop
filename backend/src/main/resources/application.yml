server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 说明：
    # 1) 数据库/表字符集使用 utf8mb4（见 db 脚本），即可支持 emoji
    # 2) JDBC 连接这里的 characterEncoding 必须是 Java 支持的编码名，例如 utf8 / UTF-8，
    #    不能写成 utf8mb4，否则会出现 “Unsupported character encoding 'utf8mb4'” 异常
    url: jdbc:mysql://localhost:3308/fruit_shop?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# JWT配置
jwt:
  # JWT密钥必须至少32个字符（256位）才能满足HMAC-SHA256的要求
  secret: fruitShopSecretKey2024ForGraduationProjectMustBeLongEnough
  expiration: 86400000 # 24小时

# 文件上传配置
file:
  upload-path: D:/uploads/fruit-shop/

